<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>PairNest</title>
<link rel="manifest" href="/manifest.json" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<!-- 让网页自己画到状态栏底下，否则 iOS 用主题色刷一条，看着就是分层 -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="apple-touch-icon" href="/icon-180.png?v=2" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="PairNest" />
<meta name="theme-color" content="#fdf1e6" />
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --paper:#fff6f7; --card:#fffdfd; --ink:#6b4a52; --sub:#b58e97;
    --line:#e8b9c4; --pink:#ffb3c8; --pink-d:#ff8fae; --cream:#fff0e6;
    --wall:#fff1f4; --floor:#ffe3d5;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100vh;min-height:100vh}
  body{
    margin:0;background:#fdf1e6;color:var(--ink);overflow:hidden;
    font-family:-apple-system,"PingFang SC","Hiragino Sans GB",sans-serif;
  }

  /* ===== 主页：一间屋子 ===== */
  #home{position:fixed;inset:0}
  body:has(#home){background:linear-gradient(to bottom,#fdf5ea 0 50%,#f7b87f 50% 100%)}
  .ico{
    width:38px;height:38px;border:2.5px solid var(--line);border-radius:12px;
    background:var(--cream);display:grid;place-items:center;font-size:17px;cursor:pointer
  }
  .room{
    position:absolute;inset:0;
    background:#fdf1e6 url('/room3.jpg?v=1') center top/cover no-repeat;
  }
  /* 墙上的装饰 */
  .deco{position:absolute;z-index:1;pointer-events:none;user-select:none}
  .deco img{display:block;width:100%}
  /* 天空 */
  .d-c1{left:5%;top:12%;width:23%}
  .d-c2{left:37%;top:4.5%;width:23%}
  .d-c3{left:69%;top:11%;width:23%}
  .d-can{display:none}
  /* 墙面 */
  .d-shop{display:none}
  .d-frame{display:none}
  .d-plant{left:2%;bottom:33%;width:13%;z-index:2}
  /* 小熊 */
  .bearwrap{display:none}
  .bear{width:104px;display:block;animation:bob 3.2s ease-in-out infinite;cursor:pointer}
  .shadow{
    width:64px;height:12px;margin:-6px auto 0;border-radius:50%;
    background:rgba(150,105,70,.22);filter:blur(3px)
  }
  .catwrap{position:absolute;left:50%;bottom:25%;transform:translateX(-50%);text-align:center;z-index:3}
  .cat{width:96px;animation:bob 2.6s ease-in-out infinite;cursor:pointer}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  .catname{display:none!important;margin:0 auto 5px;width:fit-content;font-size:11px;color:var(--sub);
    background:#fff;border:2px solid var(--line);border-radius:12px;padding:2px 10px
  }
  .topcard{
    display:none!important;position:absolute;left:14px;top:14px;z-index:3;align-items:center;gap:10px;
    background:#fff;border:2.5px solid var(--line);border-radius:22px;padding:6px 16px 6px 6px
  }
  .avs{display:flex}
  .avs .av{
    width:44px;height:44px;border-radius:50%;border:2.5px solid #fff;
    background:#ffd9e7;display:grid;place-items:center;font-size:11px;color:#8d5560;overflow:hidden
  }
  .avs .av img{width:100%;height:100%;object-fit:cover}
  .avs .a2{margin-left:-14px}
  .tdays{font-size:13px;color:var(--sub);white-space:nowrap}
  .tdays b{font-size:17px;color:var(--pink-d);margin:0 2px}

  .dock{
    position:absolute;left:0;right:0;bottom:0;
    display:flex;justify-content:space-around;align-items:center;
    padding:8px 10px calc(7px + env(safe-area-inset-bottom));
    margin:0 8px;background:none;z-index:4
  }
  .dock::before{
    content:"";position:absolute;inset:0 0 calc(2px + env(safe-area-inset-bottom));
    background:url('/d-dock.png?v=1') center/100% 100% no-repeat;z-index:-1
  }
  .dockbtn{text-align:center;font-size:12px;color:var(--ink);cursor:pointer;flex:1}
  .dockbtn img{
    display:block;width:56px;height:46px;object-fit:contain;
    object-position:center bottom;margin:0 auto 2px;transform-origin:center bottom
  }
  .dockbtn[data-p="game"] img{transform:scale(1.14)}
  .dockbtn[data-p="memory"] img{transform:scale(1.06)}
  .dockbtn[data-p="loc"] img{transform:scale(.96)}
  .dockbtn[data-p="us"] img{transform:scale(.94)}
  .dockbtn:active{transform:translateY(2px)}

  /* ===== 内页 ===== */
  #page{
    position:fixed;inset:0;background:var(--paper);z-index:10;
    display:none;flex-direction:column;
  }
  #page.on{display:flex}
  .phead{
    position:relative;display:flex;align-items:center;gap:10px;
    padding:calc(12px + env(safe-area-inset-top)) 14px 12px;
    background:none;border-bottom:none
  }
  .phead b{
    position:absolute;left:0;right:0;text-align:center;pointer-events:none
  }
  .phead .ico{
    border:none;background:none;width:32px;height:32px;font-size:28px;color:#6b4a52
  }
  /* 恋爱记忆页：顶栏化到背景里 */
  #page.bare .phead{background:none;border-bottom:none;position:absolute;z-index:3}
  #page.bare .phead b{display:none}
  #page.bare .phead .ico{
    border:none;background:none;width:32px;height:32px;font-size:30px;
    color:#6b4a52;text-shadow:0 1px 2px rgba(255,255,255,.9)
  }
  #page.bare{background-image:none;background:#fdf5ee}
  body:has(#page.bare.on){background:#e3f2fd}
  .phead b{font-size:15px}
  .pbody{flex:1;overflow-y:auto;padding:14px 14px 40px}
  #page.diary .pbody{padding-top:0;padding-bottom:calc(22px + env(safe-area-inset-bottom))}
  .pbody.memhero{padding-top:0}
  .pbody.memhero .big2:first-of-type{margin-top:16px}
  .memban{
    aspect-ratio:780/676;margin:0 -14px 30px;
    background:url('/m-hero.jpg?v=1') center top/100% 100% no-repeat;
  }
  .card{
    background:var(--card);border:2.5px solid var(--line);border-radius:18px;
    padding:14px;margin-bottom:12px;box-shadow:0 3px 0 var(--line)
  }
  h2{margin:0 0 10px;font-size:14px}
  /* 默契挑战 */
  .qscore{display:flex;align-items:baseline;gap:6px;font-size:13px;color:var(--sub)}
  .qscore b{font-size:26px;color:var(--pink-d)}
  .qbar{height:9px;border-radius:6px;background:#f6e2e8;border:2px solid var(--line);
    overflow:hidden;margin-top:9px}
  .qbar i{display:block;height:100%;background:var(--pink-d)}
  .qcard{background:var(--card);border:2.5px solid var(--line);border-radius:18px;
    padding:13px;margin-bottom:12px;box-shadow:0 3px 0 var(--line)}
  .qno{font-size:11px;color:var(--sub);margin-bottom:5px}
  .qtext{font-size:14px;line-height:1.6;margin-bottom:10px}
  .qopt{border:2px solid var(--line);border-radius:13px;background:var(--cream);
    padding:9px 12px;font-size:13px;margin-bottom:7px;cursor:pointer;line-height:1.5}
  .qopt:active{transform:translateY(2px)}
  .qopt.her{border-color:#e79ab4;background:#ffeef4}
  .qopt.mine{border-color:#9ea6e8;background:#eef0ff}
  .qopt.both{border-color:#8fca9a;background:#eefaf0}
  .qtag{float:right;font-size:11px;color:var(--sub);margin-left:8px}
  .qwhy{border-top:1.5px dashed #f3d6de;margin-top:9px;padding-top:9px;
    font-size:12.5px;line-height:1.85;color:var(--sub)}
  .qhit{font-size:12px;font-weight:700;margin-bottom:6px}
  .qhit.y{color:#4f9e63} .qhit.n{color:#c97b95}
  .row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;font-size:14px}
  .row+.row{border-top:1.5px dashed #f3d6de}
  .n{font-weight:700;color:var(--pink-d)}
  .grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .chip{
    border:2px solid var(--line);border-radius:14px;background:var(--cream);
    padding:9px 0;text-align:center;font-size:12px;cursor:pointer
  }
  .chip.on{background:var(--pink);color:#fff;border-color:var(--pink-d)}
  .chip:active{transform:translateY(2px)}
  .log{font-size:12px;color:var(--sub);margin-top:10px;line-height:1.9}
  .undo{
    margin-top:9px;text-align:center;font-size:12px;color:var(--sub);
    border:1.5px dashed var(--line);border-radius:12px;padding:7px;cursor:pointer
  }
  .foot{text-align:center;color:var(--sub);font-size:11px;margin:14px 0}
  .cal-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .cal-h b{font-size:20px}
  .cal-h span{font-size:13px;color:var(--sub);cursor:pointer;padding:4px 10px}
  /* 心情日记页 */
  #page.diary{background-image:none;background:#fdefe8}

  #page.diary .phead{background:none;border-bottom:none;position:absolute;z-index:3;
    padding-top:calc(12px + env(safe-area-inset-top))}
  #page.diary .phead b{display:none}
  #page.diary .phead .ico{
    border:none;background:none;width:32px;height:32px;font-size:30px;color:#8a5a63
  }
  #page.diary .pbody{padding-top:env(safe-area-inset-top);background:none}

  /* 熊耳气泡：整图不切，内容多了在气泡里自己滚 */
  .bbub{
    position:relative;margin:16px 0 0;width:100%;aspect-ratio:1680/1008;
    background:url('/c-bub.png?v=1') center/100% 100% no-repeat
  }
  .bbub-in{
    position:absolute;left:9.5%;right:9.5%;top:23%;bottom:10%;text-align:left;
    display:flex;flex-direction:column;gap:6px
  }
  .bbub-ttl{font-size:13.5px;font-weight:700;color:#6b4a3c;line-height:1.6;flex:none}
  .bbub-body{
    flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
    font-size:12.5px;color:#7a5d50;line-height:1.95;white-space:pre-wrap
  }
  .bbub-body b{color:#6b4a3c}
  .bbub-body code{font-size:11.5px;background:rgba(255,255,255,.55);padding:1px 4px;border-radius:5px}

  /* 窗口交接：三块拉伸气泡（素材由 GPT 切，接缝零误差） */
  .gbub{position:relative;margin:16px 0 0}
  .gbub-t{aspect-ratio:1680/318;background:url('/g-top.png?v=3') top center/100% 100% no-repeat}
  .gbub-m{
    background:url('/g-mid.png?v=3') top center/100% auto repeat-y;
    padding:0 6%;margin-top:-1px
  }
  .gbub-b{aspect-ratio:1680/177;background:url('/g-bot.png?v=3') bottom center/100% 100% no-repeat;margin-top:-1px}
  .gbub-ttl{
    font-size:14px;font-weight:700;color:#6b4a3c;line-height:1.7;padding-bottom:4px;
    display:flex;align-items:flex-start;justify-content:space-between;gap:10px;cursor:pointer
  }
  .gbub-x{font-style:normal;font-size:15px;color:#c0a08e;line-height:1.7;flex:none}
  .gbub-cut{display:grid;grid-template-rows:0fr;transition:grid-template-rows .26s ease}
  .gbub.open .gbub-cut{grid-template-rows:1fr}
  .gbub-cut>div{overflow:hidden}
  .gbub-body{font-size:12.5px;color:#7a5d50;line-height:2;white-space:pre-wrap;padding-bottom:6px}
  .gbub-body b{color:#6b4a3c}

  /* 原话 / 长期记忆 / 窗口交接 的底纹 */
  #page.quotes,#page.memo,#page.handoff{
    background:#fdf6ec url('/p-bg.jpg?v=1') top center/100% auto no-repeat;
    background-attachment:local
  }

  /* 原话气泡 */
  .qbub{
    position:relative;width:100%;aspect-ratio:1680/760;margin:12px 0 0;
    background:url('/q-bub.png?v=1') center/100% 100% no-repeat
  }
  .qbub-t{
    position:absolute;left:10%;right:10%;top:15%;bottom:9%;overflow:hidden;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;gap:6px
  }
  .qbub-x{font-size:14px;line-height:1.8;color:#6b4a3c}
  .qbub-d{font-size:10.5px;color:#b58c80}

  /* 密钥本口令页 */
  #page.keys{
    background:#fffaf2;
  }
  #page.keys .phead{position:absolute;left:0;right:0;top:0;z-index:3}
  #page.keys .phead b{display:none}
  #page.keys .phead .ico{color:#70463d;text-shadow:0 1px 2px #fff}
  #page.keys .pbody{padding:0 0 30px;overflow-y:auto}
  /* 密钥本 */
  #page.keys{background:#fdf3ec url('/k-bg.jpg?v=1') top center/100% auto no-repeat}
  .keyscreen{padding:26px 0 30px;text-align:center}
  .ktitle{width:148px;max-width:44%;display:block;margin:0 auto 16px}
  .kwrap{
    position:relative;width:88%;max-width:340px;margin:0 auto;
    aspect-ratio:454/760
  }
  .kcard{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .kpin{
    position:absolute;left:7%;top:34%;width:86%;cursor:text
  }
  .kpin img{display:block;width:100%}
  .kdots{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:13%
  }
  .kdot{
    width:11px;height:11px;border-radius:50%;background:transparent;
    border:2px solid #b98f86
  }
  .kdot.on{background:#7a4a3e;border-color:#7a4a3e}
  #keypw{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;font-size:16px}
  .kbtn{
    position:absolute;left:9%;top:63.5%;width:82%;background:none;border:0;padding:0;cursor:pointer
  }
  .kbtn img{display:block;width:100%}
  .kbtn:active{transform:translateY(2px)}
  .keyerr{
    position:absolute;left:6%;right:6%;top:76%;font-size:13px;color:#c45e72
  }
  /* 解锁后的项目气泡 */
  #keybox{padding:0 16px 24px}
  .kintro{font-size:12px;color:#9b7d6e;text-align:center;margin:6px 0 16px;line-height:1.9}
  .kbub-w{position:relative;margin:22px 0 0}
  .kbub{
    position:relative;z-index:1;padding:12px 16px 14px;
    background:#fdf8ec;border:2.5px solid #6e4b3c;border-radius:22px;
    box-shadow:0 2px 0 rgba(110,75,60,.12);text-align:left
  }
  .kbub-h{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    font-size:14px;font-weight:700;color:#6e4b3c;cursor:pointer;user-select:none
  }
  .kbub-x{font-style:normal;font-size:15px;color:#b98f86;line-height:1}
  .kbub-b{
    display:grid;grid-template-rows:0fr;transition:grid-template-rows .26s ease,margin-top .26s ease
  }
  .kbub-i{
    overflow:hidden;font-size:12.5px;color:#7a5d50;line-height:2;white-space:pre-wrap
  }
  .kbub.open .kbub-b{grid-template-rows:1fr;margin-top:8px}
  .keyopen{position:absolute;left:14px;right:14px;top:74px;bottom:20px;overflow:auto;background:rgba(255,255,255,.9)}
  .dwrap{margin:0 -14px 4px}
  .dbg{display:block;width:100%}
  .dtop{text-align:center;margin:6px 0 10px}
  .dtitle{width:168px;max-width:48%;display:block;margin:0 auto 8px;
    filter:drop-shadow(0 1px 2px rgba(255,255,255,.7))}
  .dmon{
    display:inline-flex;align-items:center;gap:14px;margin-bottom:8px;
    font-size:15px;font-weight:700;color:#8a5a63
  }
  .dmon b{
    background:#fbc7d6;border-radius:22px;padding:6px 22px;font-size:15px;color:#fff;
    box-shadow:0 2px 0 rgba(0,0,0,.06)
  }
  .dmon span{font-size:19px;color:#c98ba0;cursor:pointer;padding:0 4px;user-select:none}
  .dsheet{
    background:url('/dcal.png?v=1') center/100% 100% no-repeat;
    padding:18px 18px 22px;margin:0 -6px
  }
  .dpen{
    position:fixed;right:20px;bottom:calc(24px + env(safe-area-inset-bottom));
    width:58px;height:58px;z-index:15;cursor:pointer;
    filter:drop-shadow(0 3px 5px rgba(180,110,130,.35))
  }
  .dpen:active{transform:translateY(2px)}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .cal .w{text-align:center;font-size:12px;color:#a8737f;font-weight:700;padding-bottom:6px}
  .cal .d{
    aspect-ratio:1/1.02;min-width:0;border-radius:12px;background:#fffdfc;border:1.5px solid #f6dae2;
    display:flex;flex-direction:column;align-items:center;
    padding-top:5px;font-size:12px;cursor:pointer;position:relative
  }

  .cal .d.empty{background:none;border:none;cursor:default}
  .cal .d.today{border-color:var(--pink-d);color:var(--pink-d);font-weight:700}
  .cal .d .dots{margin-top:auto;margin-bottom:3px;display:flex;flex-direction:column;
    align-items:center;gap:1px;line-height:0}
  .cal .d .dot{font-size:11px;line-height:0;display:flex;justify-content:center}
  .cal .d .dot img{width:21px;height:21px}
  .cal .d.has{background:#fff0f4}
  .write{
    position:fixed;inset:0;background:var(--paper);z-index:20;display:none;flex-direction:column
  }
  .write.on{display:flex}
  .wsheet{
    flex:1;margin:10px 12px 14px;
    background:url('/d-wcard.png?v=1') center/100% 100% no-repeat;
    border:none;padding:22px 20px 26px;display:flex;flex-direction:column
  }
  .wtop{position:relative;min-height:78px;margin-bottom:6px}
  .wdate{position:absolute;left:0;top:6px;display:flex;align-items:baseline;gap:5px}
  .wdate b{font-size:32px;line-height:1}
  .wdate span{font-size:12px;color:var(--sub);line-height:1.35;max-width:46px}
  .moodpick{
    width:120px;margin:0 auto;text-align:center;cursor:pointer;padding-top:2px
  }
  .moodpick img{display:block;width:60px;height:60px;object-fit:contain;margin:0 auto 2px}
  .moodpick .nm{
    display:inline-block;background:#ffd9a3;border-radius:11px;
    padding:2px 14px;font-size:13px;font-weight:700;color:#8a5a3a
  }
  .moodpick.empty .nm{background:#f3e4e8;color:#a8828c;font-weight:400}
  .warea{
    flex:1;width:100%;border:none;outline:none;resize:none;font-size:14px;line-height:1.9;
    color:var(--ink);font-family:inherit;background:transparent
  }
  .warea::placeholder{color:#d8bcc4}
  /* 写日记页 */
  .write .phead{background:none;border-bottom:none;padding:10px 14px 4px}
  .write .phead b{display:none}
  .write .phead .ico#wback{
    border:none;background:none;width:32px;height:32px;font-size:30px;color:#6b4a52
  }
  .cap{
    border-style:solid;border-width:10px 17px;border-color:transparent;
    border-image:url('/d-cap.png?v=1') 110 fill / 10px 17px stretch;
    background:none;color:#6b4a52;font-weight:700;
    display:inline-flex;align-items:center;justify-content:center;
    padding:0;cursor:pointer;line-height:1.15
  }
  .cap:active{transform:translateY(2px)}
  .tagslabel{margin:2px 16px 6px;font-size:13px;font-weight:700;color:#8a5a63}
  .tags{display:flex;flex-wrap:wrap;gap:9px;margin:0 14px 20px}
  .tag{font-size:12.5px}
  .tag.on{
    border-image-source:none;background:var(--pink);color:#fff;
    border:2px solid var(--ink);border-radius:15px;padding:5px 13px
  }
  .sheet{
    position:fixed;inset:0;z-index:30;display:none;
    background:var(--paper);flex-direction:column
  }
  .sheet.on{display:flex}
  .shead{display:flex;align-items:center;padding:16px 18px;font-size:15px;font-weight:700}
  .shead .x{margin-left:auto;font-size:22px;color:var(--sub);cursor:pointer;line-height:1}
  .stitle{text-align:center;font-size:19px;font-weight:700;margin:26px 0 30px}
  .faces{display:grid;grid-template-columns:repeat(3,1fr);gap:18px 6px;padding:0 12px}
  .face{text-align:center;cursor:pointer}
  .face svg,.face img{display:block;margin:0 auto 6px}
  .face img{width:96px;height:96px;object-fit:contain}
  .face span{font-size:14px}
  .face:active svg,.face:active img{transform:scale(.92)}
  .face.on span{color:var(--pink-d);font-weight:700}
  /* 日记本：已保存那天的展示 */
  .dv-top{position:relative;display:flex;align-items:flex-start;margin:26px 0 20px;min-height:76px}

// 预览卡：按住拖动挪背景图，决定露出哪一块
(function(){
  let on=false,sx=0,sy=0,px=50,py=50;
  const pv=()=>document.getElementById('anPrev');
  const start=e=>{
    const el=pv(); if(!el||!e.target.closest('#anPrev')) return;
    on=true;
    const p=(el.style.backgroundPosition||'50% 50%').split(' ');
    px=parseFloat(p[0])||50; py=parseFloat(p[1]!==undefined?p[1]:p[0])||50;
    const t=e.touches?e.touches[0]:e; sx=t.clientX; sy=t.clientY;
  };
  const move=e=>{
    if(!on) return;
    const el=pv(); if(!el) return;
    const t=e.touches?e.touches[0]:e;
    const nx=Math.max(0,Math.min(100, px - (t.clientX-sx)/el.offsetWidth*100));
    const ny=Math.max(0,Math.min(100, py - (t.clientY-sy)/el.offsetHeight*100));
    el.style.backgroundPosition=nx.toFixed(1)+'% '+ny.toFixed(1)+'%';
    e.preventDefault();
  };
  const end=()=>{ on=false; };
  document.addEventListener('mousedown',start);
  document.addEventListener('touchstart',start,{passive:true});
  document.addEventListener('mousemove',move);
  document.addEventListener('touchmove',move,{passive:false});
  document.addEventListener('mouseup',end);
  document.addEventListener('touchend',end);
})();

// 纪念日预览：天数照日期 + 每年重复 + 包含起始日 实时算
function anDays(){
  const el=document.getElementById('anDate'); if(!el||!el.value) return;
  const yearly=document.getElementById('anYearly')?.classList.contains('on');
  const inc=document.getElementById('anInc')?.classList.contains('on');
  const today=S.today;
  let d=el.value;
  if(yearly){
    const y=+today.slice(0,4), md=d.slice(4);
    d=((y+md) < today ? y+1 : y)+md;
  }
  const day=86400000;
  const n=Math.round((Date.parse(d+'T00:00:00Z')-Date.parse(today+'T00:00:00Z'))/day);
  const b=document.getElementById('pvNum'); if(!b) return;
  if(n>0) b.textContent='还有 '+n+' 天';
  else if(n===0) b.textContent='今天';
  else b.textContent=(-n + (inc?1:0))+' 天';
}

document.addEventListener('input', e=>{
  if(e.target.id==='anName'){
    const n=document.getElementById('pvName');
    if(n) n.textContent=e.target.value.trim()||'纪念日';
  }
});
document.addEventListener('change', async e=>{
  const t=e.target;
  if(t.id==='anName'){ const n=document.getElementById('pvName'); if(n) n.textContent=t.value.trim()||'纪念日'; return; }
  if(t.id==='anDate'){
    const d=t.value; if(!d) return;
    const tx=document.getElementById('anDateTx');
    if(tx) tx.textContent=`${+d.slice(0,4)}年${+d.slice(5,7)}月${+d.slice(8,10)}日`;
    const pv=document.getElementById('pvDate'); if(pv) pv.textContent=d.replace(/-/g,'/');
    anDays();
    return;
  }
  if(t.id==='anFile'||t.id==='anFile2'){
    const f=t.files&&t.files[0]; if(!f) return;
    const data=await new Promise(r=>{ const fr=new FileReader(); fr.onload=()=>r(fr.result); fr.readAsDataURL(f); });
    const j=await (await fetch('/api/anniv/bg',{method:'POST',
      headers:{'Content-Type':'application/json'},body:JSON.stringify({data})})).json();
    if(!j.ok) return;
    document.querySelectorAll('[data-anbg]').forEach(x=>x.classList.remove('on'));
    const box=document.querySelector('.anbgs');
    const sp=document.createElement('span');
    sp.className='anbg on'; sp.dataset.anbg=j.url; sp.style.backgroundImage=`url(${j.url})`;
    box.insertBefore(sp, box.lastElementChild);
    document.getElementById('anPrev').style.backgroundImage=`url(${j.url})`;
  }
});

let QZ = null;
function quizHtml(){
  if(!QZ) return '<div class="card">正在拿题…</div>';
  const qs = QZ.questions;
  const done = qs.filter(q=>q.pick!=null);
  const hit  = done.filter(q=>q.pick===q.mine).length;
  const pct  = done.length ? Math.round(hit/done.length*100) : 0;

  let h = `<div class="card">
    <div class="qscore"><b>${pct}</b>% 默契
      <span style="margin-left:auto">${done.length}/${qs.length} 题</span></div>
    <div class="qbar"><i style="width:${done.length?pct:0}%"></i></div>
    <div style="font-size:12px;color:var(--sub);margin-top:9px;line-height:1.8">
      我先答完了，答案封着。你选完那一刻才翻开，翻开还能看到我为什么这么选。</div>
  </div>`;

  qs.forEach((q,i)=>{
    const answered = q.pick!=null;
    h += `<div class="qcard">
      <div class="qno">第 ${i+1} 题</div>
      <div class="qtext">${q.q}</div>`;
    if(answered){
      const ok = q.pick===q.mine;
      h += `<div class="qhit ${ok?'y':'n'}">${ok?'默契 ✓ 我也选的这个':'差了一点 ✗'}</div>`;
    }
    q.opts.forEach((o,k)=>{
      let cls='qopt', tag='';
      if(answered){
        const isHer = k===q.pick, isMine = k===q.mine;
        if(isHer&&isMine){ cls+=' both'; tag='<span class="qtag">你 · 我</span>'; }
        else if(isHer){ cls+=' her'; tag='<span class="qtag">你选的</span>'; }
        else if(isMine){ cls+=' mine'; tag='<span class="qtag">我选的</span>'; }
      }
      h += `<div class="${cls}"${answered?'':` data-q="${q.id}" data-k="${k}"`}>${tag}${o}</div>`;
    });
    if(answered) h += `<div class="qwhy">${q.why}</div>`;
    h += `</div>`;
  });
  return h;
}

let amapReady=null;

async function initMap(){
  const box=document.getElementById('amapbox');
  if(!box) return;
  if(window.__map){ try{ window.__map.destroy(); }catch(e){} window.__map=null; }
  let AMap;
  try { AMap=await loadAMap(); }
  catch(e){ box.innerHTML='<div style="padding:24px;text-align:center;font-size:13px;color:var(--sub)">地图没加载出来</div>'; return; }
  const ls=(S.locs||[]).slice().reverse();
  const last=ls[0];
  const her=last?[last.glon??last.lon, last.glat??last.lat]:null;
  const me=[ME.lon, ME.lat];
  // 隔着太平洋，两个点放一张图上只剩两个边角，所以默认就贴着她看
  const map=new AMap.Map(box,{
    zoom: her?14:10, center: her||me, resizeEnable:true, viewMode:'2D'
  });
  try{ map.setMapStyle('amap://styles/macaron'); }catch(e){ console.log('style fail', e); }
  map.on('complete',()=>{
    // 走过的点：从旧到新连成一条线，最新那个才挂头像
    const pts=ls.slice(0,30).reverse()
      .map(x=>[x.glon??x.lon, x.glat??x.lat]);
    if(pts.length>1){
      map.add(new AMap.Polyline({
        path:pts, strokeColor:'#f08aa8', strokeWeight:4,
        strokeOpacity:.85, lineJoin:'round', zIndex:60
      }));
      pts.slice(0,-1).forEach(pt=>map.add(new AMap.CircleMarker({
        center:pt, radius:5, fillColor:'#fff', fillOpacity:1,
        strokeColor:'#f08aa8', strokeWeight:2.5, zIndex:80
      })));
    }
    if(her){ window.__herMk=avMarker(AMap, her, '/av-her.png?v=2', NAMES.her+'在这'); map.add(window.__herMk); }
    map.add(avMarker(AMap, me, '/av-me.png?v=2', NAMES.me+'在这'));
    if(pts.length>1) map.setFitView(null, false, [50,50,50,50]);
  });
  window.__map=map; window.__AMap=AMap; window.__her=her; window.__me=me;
}
// 打开 app 自动报一次位置。两道闸：本机 20 分钟内不重复问，后端还会再判一次没挪窝就不记
async function autoReport(){
  try{
    if(!window.isSecureContext || !navigator.geolocation) return;
    const last = +(localStorage.getItem('autoloc') || 0);
    if(Date.now() - last < 20*60*1000) return;
    if(navigator.permissions){
      try{
        const st = await navigator.permissions.query({name:'geolocation'});
        if(st.state !== 'granted') return;   // 没授权过就别弹框打扰她
      }catch(e){}
    }
    localStorage.setItem('autoloc', String(Date.now()));
    navigator.geolocation.getCurrentPosition(async p=>{
      try{
        const r = await (await fetch('/api/loc',{method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({lat:p.coords.latitude, lon:p.coords.longitude, auto:true})})).json();
        if(!r.skipped){
          S = await (await fetch('/api/state')).json();
          if(curPage==='loc'){ const b=document.getElementById('amapbox'); if(b) initMap(); }
        }
      }catch(e){}
    }, ()=>{}, {enableHighAccuracy:false, timeout:20000, maximumAge:300000});
  }catch(e){}
}

const IMGTHEME={loc:'/px-bg.png', diary:'/dtop.jpg?v=2', memory:'/m-hero.jpg?v=1',
  keys:'/k-bg.jpg?v=1', quotes:'/p-bg.jpg?v=1', memo:'/p-bg.jpg?v=1', handoff:'/p-bg.jpg?v=1'};
const _themeCache={};
function themeFromImage(url, cb){
  if(_themeCache[url]) return cb(_themeCache[url]);
  const img=new Image();
  img.onload=()=>{
    try{
      const w=Math.min(img.width,64);
      const c=document.createElement('canvas'); c.width=w; c.height=1;
      const x=c.getContext('2d',{willReadFrequently:true});
      x.drawImage(img,0,0,img.width,1,0,0,w,1);
      const d=x.getImageData(0,0,w,1).data;
      let r=0,g=0,b=0;
      for(let i=0;i<w;i++){ r+=d[i*4]; g+=d[i*4+1]; b+=d[i*4+2]; }
      const col=`rgb(${Math.round(r/w)}, ${Math.round(g/w)}, ${Math.round(b/w)})`;
      _themeCache[url]=col; cb(col);
    }catch(e){}
  };
  img.src=url;
}

function haversine(a,b,c,d){
  const R=6371,r=x=>x*Math.PI/180;
  const dl=r(c-a), dn=r(d-b);
  const h=Math.sin(dl/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(dn/2)**2;
  return Math.round(2*R*Math.asin(Math.sqrt(h)));
}

// 真实经期涂深色；再按平均周期往后推预测、排卵、易孕
function periodMarks(ps){
  const m={};
  const add=(day,cls)=>{ if(!m[day]) m[day]=cls; };
  const iso=d=>new Date(d).toISOString().slice(0,10);
  const cfg=S.pdcfg||{len:5,cycle:28};
  // 每一段的开始日往后按经期天数铺浅粉（真实记录会盖掉）
  for(const st0 of periodStarts()){
    const a=Date.parse(st0+'T00:00:00Z');
    for(let i=0;i<cfg.len;i++) add(iso(a+i*86400000),'p-pred');
  }
  // 真实的盖在预测上面
  for(const day of (S.pdays||[])) m[day]='p-real';
  const cyc=cycleAvg(ps)||cfg.cycle;
  const last=periodStarts().pop();
  if(last){
    let base=Date.parse(last+'T00:00:00Z');
    for(let k=1;k<=3;k++){
      const st=base+cyc*k*86400000;
      for(let i=0;i<cfg.len;i++) add(iso(st+i*86400000),'p-pred');
      const ovu=st-14*86400000;
      add(iso(ovu),'p-ovu');
      for(let i=-4;i<=1;i++) if(i!==0) add(iso(ovu+i*86400000),'p-fert');
    }
  }
  return m;
}

function periodStarts(){
  const ds=(S.pdays||[]).slice().sort();
  const out=[];
  for(let i=0;i<ds.length;i++){
    const prev=ds[i-1];
    if(!prev || Date.parse(ds[i]+'T00:00:00Z')-Date.parse(prev+'T00:00:00Z') > 86400000*2)
      out.push(ds[i]);
  }
  return out;
}

function cycleAvg(ps){
  const s=periodStarts();
  if(s.length<2) return null;
  let sum=0;
  for(let i=1;i<s.length;i++)
    sum+=Math.round((Date.parse(s[i]+'T00:00:00Z')-Date.parse(s[i-1]+'T00:00:00Z'))/86400000);
  return Math.round(sum/(s.length-1));
}

    const esc=t=>t.replace(/</g,'&lt;').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
    const lines=(d.text||'').split('\n');
    const groups=[]; let intro=[];
    for(const ln of lines){
      const m=ln.match(/^【(.+)】\s*$/);
      if(m) groups.push({title:m[1],body:[]});
      else if(groups.length) groups[groups.length-1].body.push(ln);
      else intro.push(ln);
    }
    const head=intro.join('\n').trim();
    box.innerHTML = (head?`<div class="kintro">${esc(head)}</div>`:'')
      + (groups.length ? groups.map(g=>`
        <div class="gbub">
          <div class="gbub-t"></div>
          <div class="gbub-m">
            <div class="gbub-ttl"><span>${esc(g.title)}</span><i class="gbub-x">＋</i></div>
            <div class="gbub-cut"><div><div class="gbub-body">${esc(g.body.join('\n').trim())}</div></div></div>
          </div>
          <div class="gbub-b"></div>
        </div>`).join('')
        : `<div class="gbub"><div class="gbub-t"></div><div class="gbub-m"><div class="gbub-body">${
            esc(d.text||'')}</div></div><div class="gbub-b"></div></div>`);
  }catch(e){ box.innerHTML='<div class="kintro">读不出来</div>'; }
}

function cmtHtml(c,i){
  const t=c.at?new Date(c.at):null;
  const hm=t?`${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}`:'';
  return `<div class="cmt"><b>${NAMES.her}:</b>${c.text.replace(/</g,'&lt;')}
    <span class="t">今天 ${hm}</span><span class="del" data-del="${i}">
      <svg width="17" height="17" viewBox="0 0 20 20">
        <path d="M4 6h12M8 6V4.5A1.5 1.5 0 0 1 9.5 3h1A1.5 1.5 0 0 1 12 4.5V6"
              fill="none" stroke="#b58e97" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M6 6l.8 9.2A1.5 1.5 0 0 0 8.3 16.5h3.4a1.5 1.5 0 0 0 1.5-1.3L14 6"
              fill="none" stroke="#b58e97" stroke-width="1.8" stroke-linejoin="round"/>
      </svg></span></div>`;
}

let pendingWrite=false;
let moodTarget='me';
let moodDay=null;
function paintMood(name){
  const el=$('wmood');
  el.dataset.mood = name || '';
  if(name && FACE_SVG[name]){
    el.classList.remove('empty');
    el.innerHTML = FACE_SVG[name].replace('width="58" height="58"','width="60" height="60"')
                 + `<span class="nm">${name}</span>`;
  }else{
    el.classList.add('empty');
    el.innerHTML = '<div class="nm">选个心情</div>';
  }
}
function openMoodSheet(day, who){
  moodTarget = who || 'me';
  const src = day || wday;
  const [y,m,d]=src.split('-');
  const wk=['日','一','二','三','四','五','六'][new Date(Date.UTC(+y,+m-1,+d)).getUTCDay()];
  $('mdate').textContent=`${+m}月${+d}日 星期${wk}`;
  $('stitle') && ($('stitle').textContent = moodTarget==='her' ? '你今天的心情是……' : '今天的心情是……');
  const cur = moodTarget==='her' ? ((S.hermoods||{})[src]||'') : $('wmood').dataset.mood;
  moodDay = src;
  $('faces').innerHTML=MOOD_LIST.map(k=>
    `<div class="face${k===cur?' on':''}" data-face="${k}">${FACE_SVG[k]}<span>${k}</span></div>`).join('');
  $('msheet').classList.add('on');
}
function openWrite(day){
  wday=day;
  const [y,m,d]=day.split('-');
  $('wd').textContent=+d; $('wym').textContent=`${+m}月 ${y}年`;
  const rec=(S.diaries&&S.diaries[day])||{};
  $('wtext').value=rec.text||'';
  paintMood(S.moods[day]||'');
  $('wtags').innerHTML=TAGS.map(t=>
    `<div class="cap tag${(rec.tags||[]).includes(t)?' on':''}" data-tag="${t}">${t}</div>`).join('');
  if(S.moods[day]){
    $('write').classList.add('on');
  }else{
    pendingWrite=true;      // 先问心情，选完才进来写字
    openMoodSheet();
  }
}
function enterWriteAfterMood(){
  $('msheet').classList.remove('on');
  if(pendingWrite){ pendingWrite=false; $('write').classList.add('on'); }
}

$('wtags').onclick=e=>{ if(e.target.dataset.tag) e.target.classList.toggle('on'); };
$('wmood').onclick=()=>openMoodSheet(wday,'me');
$('mclose').onclick=enterWriteAfterMood;
$('faces').onclick=async e=>{
  const f=e.target.closest('[data-face]'); if(!f) return;
  const pick=f.dataset.face;
  if(moodTarget==='her'){
    const day=moodDay;
    await fetch('/api/hermood',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({day, mood:pick})});
    S.hermoods=S.hermoods||{}; S.hermoods[day]=pick;
    $('msheet').classList.remove('on');
    if(curPage==='diaryview') openView(day);
    tg?.HapticFeedback?.impactOccurred?.('light');
    return;
  }
  paintMood(pick);
  enterWriteAfterMood();
  tg?.HapticFeedback?.impactOccurred?.('light');
};
$('wsave').onclick=async()=>{
  const tags=[...document.querySelectorAll('.tag.on')].map(x=>x.dataset.tag);
  const mood=$('wmood').dataset.mood||null;
  await fetch('/api/diary',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({day:wday,text:$('wtext').value,tags,mood})});
  S.diaries=S.diaries||{}; S.diaries[wday]={text:$('wtext').value,tags};
  if(mood) S.moods[wday]=mood;
  $('write').classList.remove('on');
  openView(wday);
  tg?.HapticFeedback?.impactOccurred?.('light');
};
$('cat').onclick = () => { tg?.HapticFeedback?.impactOccurred?.('light'); open('pet'); };

// 预览的联动统一走 anDays() 和上面那两个监听，这里不再重复算

$('pbody').onclick = async e => {
  const t = e.target;
  if(t.closest('#herMood')){ openMoodSheet(viewDay, 'her'); return; }
  const fo = t.closest('[data-focus]');
  if(fo && window.__map){
    const to = fo.dataset.focus==='me' ? window.__me : (window.__her || window.__me);
    window.__map.setZoomAndCenter(fo.dataset.focus==='me' ? 5 : 14, to, false, 600);
    document.querySelectorAll('[data-focus]').forEach(x=>x.classList.remove('on'));
    fo.classList.add('on');
    return;
  }
  const qo = t.closest('.qopt[data-q]');
  if(qo){
    const id=+qo.dataset.q, pick=+qo.dataset.k;
    const r=await (await fetch('/api/quiz',{method:'POST',
      headers:{'Content-Type':'application/json'},body:JSON.stringify({id,pick})})).json();
    const q=QZ.questions.find(x=>x.id===id);
    if(q){ q.pick=r.pick; q.mine=r.mine; q.why=r.why; }
    document.getElementById('quizwrap').innerHTML=quizHtml();
    tg?.HapticFeedback?.impactOccurred?.('light');
    return;
  }
  const more=t.closest('[data-more]');
  if(more){
    const el=document.querySelector('[data-memo="'+more.dataset.more+'"]');
    const open=el.style.maxHeight==='none';
    el.style.maxHeight = open ? '78px' : 'none';
    more.textContent = open ? '展开' : '收起';
    return;
  }
  const pb = t.closest('[data-pet]');
  if(pb){ if(!pb.classList.contains('off')) await petDo(pb.dataset.pet); return; }
  const go = t.closest('[data-go]');
  if(go){ open(go.dataset.go); return; }
  const fl=t.closest('[data-flow]'), pn=t.closest('[data-pain]'), sy=t.closest('[data-sym]');
  if(fl||pn||sy){
    const cur=todayRec();
    const body={day:S.today};
    if(fl) body.flow = cur.flow===+fl.dataset.flow ? null : +fl.dataset.flow;
    if(pn) body.pain = cur.pain===+pn.dataset.pain ? null : +pn.dataset.pain;
    if(sy){
      const list=(cur.symptoms||[]).slice();
      const i=list.indexOf(sy.dataset.sym);
      if(i>=0) list.splice(i,1); else list.push(sy.dataset.sym);
      body.symptoms=list;
    }
    await fetch('/api/pdrec',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify(body)});
    S=await(await fetch('/api/state')).json();
    $('pbody').innerHTML=periodHtml();
    tg?.HapticFeedback?.impactOccurred?.('light');
    return;
  }
  if(t.id==='sympAdd'){
    cbarMode='symp';
    $('cmtIn').placeholder='加一个症状';
    $('mask').classList.add('on'); $('cbar').classList.add('on');
    setTimeout(()=>$('cmtIn').focus(),80);
    return;
  }
  const pday = t.closest('[data-pday]');
  if(pday && curPage==='period'){
    await fetch('/api/pdmark',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({day:pday.dataset.pday})});
    S=await(await fetch('/api/state')).json();
    $('pbody').innerHTML=periodHtml();
    tg?.HapticFeedback?.impactOccurred?.('light');
    return;
  }
  const pcal = t.closest('[data-pcal]');
  if(pcal){ pdM += +pcal.dataset.pcal;
    if(pdM<1){pdM=12;pdY--} if(pdM>12){pdM=1;pdY++}
    $('pbody').innerHTML=periodHtml(); return; }
  const cal = t.closest('[data-cal]');
  if(cal){ calM += +cal.dataset.cal;
    if(calM<1){calM=12;calY--} if(calM>12){calM=1;calY++}
    $('pbody').innerHTML=calHtml(); return; }
  if(t.id==='dpen'){
    const k=S.today;
    if(S.diaries && S.diaries[k]) openView(k); else openWrite(k);
    return;
  }
  const day = t.closest('[data-day]');
  if(day){
    const k=day.dataset.day;
    if(S.diaries && S.diaries[k]) openView(k); else openWrite(k);
    return;
  }
  if(t.id==='pdSave'){
    await fetch('/api/pdcfg',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({len:+$('pdLen').value,cycle:+$('pdCyc').value})});
    S=await(await fetch('/api/state')).json();
    navStack.pop(); curPage='period'; open_('period');
    tg?.HapticFeedback?.impactOccurred?.('light');
    return;
  }

  if(t.closest('#anAdd')){ anEdit=null; open('annivnew'); return; }
  const anc = t.closest('[data-an]');
  if(anc && !t.closest('[data-anx]')){ anEdit=+anc.dataset.an; open('annivnew'); return; }
  const abg = t.closest('[data-anbg]');
  if(abg){
    document.querySelectorAll('[data-anbg]').forEach(x=>x.classList.remove('on'));
    abg.classList.add('on');
    const v=abg.dataset.anbg;
    $('anPrev').style.backgroundImage = `url(${v})`;
    return;
  }
  const acol = t.closest('[data-ancol]');
  if(acol){
    document.querySelectorAll('[data-ancol]').forEach(x=>x.classList.remove('on'));
    acol.classList.add('on');
    const c=acol.dataset.ancol;
    ['pvNum','pvDate','pvName'].forEach(id=>{ const el=$(id); if(el) el.style.color=c; });
    return;
  }
  if(t.id==='anDel'){
    if(!confirm('删掉这个纪念日？')) return;
    await fetch('/api/anniv/del',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({i:anEdit})});
    S=await(await fetch('/api/state')).json();
    anEdit=null; navStack.pop(); curPage='anniv'; open_('anniv');
    return;
  }
  const asz = t.closest('[data-ansz]');
  if(asz){
    document.querySelectorAll('[data-ansz]').forEach(x=>x.classList.remove('on'));
    asz.classList.add('on');
    const pv=$('anPrev');
    pv.classList.remove('sq','wide','tall'); pv.classList.add(asz.dataset.ansz);
    return;
  }
  const asw = t.closest('.sw');
  if(asw){ asw.classList.toggle('on'); anDays(); return; }
  if(t.id==='anSave'){
    const name=$('anName').value.trim()||'纪念日';
    const date=$('anDate').value; if(!date) return;
    const body={name,date,
      yearly:$('anYearly').classList.contains('on'),
      incStart:$('anInc').classList.contains('on'),
      color:(document.querySelector('[data-ancol].on')||{dataset:{}}).dataset.ancol||'#6b3d2e',
      bg:(document.querySelector('[data-anbg].on')||{dataset:{}}).dataset.anbg||'',
      bgPos:($('anPrev').style.backgroundPosition||'center'),
      size:(document.querySelector('[data-ansz].on')||{dataset:{}}).dataset.ansz||'wide'};
    if(anEdit!=null) body.i=anEdit;
    await fetch('/api/anniv',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify(body)});
    anEdit=null;
    S=await(await fetch('/api/state')).json();
    navStack.pop(); curPage='anniv'; open_('anniv');
    tg?.HapticFeedback?.impactOccurred?.('light');
    return;
  }
  const anx=t.closest('[data-anx]');
  if(anx){
    await fetch('/api/anniv/del',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({i:+anx.dataset.anx})});
    S=await(await fetch('/api/state')).json();
    $('pbody').innerHTML=render('anniv');
    return;
  }
  if(t.closest('#keygo')){
    if(!$('keypw').value){ $('keyerr').textContent='先输入口令呀'; $('keypw').focus(); return; }
    const r=await fetch('/api/keys',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({pw:$('keypw').value})});
    const d=await r.json();
    if(d.ok){
      $('keygate').remove();
      document.querySelector('.ktitle')?.remove();
      $('keybox').innerHTML = renderKeyGroups(d.text);
    } else {
      $('keyerr').textContent='口令不对，再想想 ♡';
      $('keypw').select();
      tg?.HapticFeedback?.notificationOccurred?.('error');
    }
    return;
  }
  const gbt=t.closest('.gbub-ttl');
  if(gbt){ const w=gbt.closest('.gbub'); w.classList.toggle('open');
    gbt.querySelector('.gbub-x').textContent = w.classList.contains('open')?'−':'＋';
    return; }
  const kbh=t.closest('.kbub-h');
  if(kbh){ kbh.parentElement.classList.toggle('open');
    kbh.querySelector('.kbub-x').textContent = kbh.parentElement.classList.contains('open')?'−':'＋';
    return; }
  if(t.closest('#cmtToggle')){
    cbarMode='cmt'; $('cmtIn').placeholder='请输入评论';
    $('mask').classList.add('on'); $('cbar').classList.add('on');
    setTimeout(()=>$('cmtIn').focus(),80);
    return;
  }
  const del=t.closest('[data-del]');
  if(del){
    const i=+del.dataset.del;
    await fetch('/api/comment/del',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({day:viewDay,i})});
    S.diaries[viewDay].comments.splice(i,1);
    document.querySelector('.cmts').innerHTML=
      S.diaries[viewDay].comments.map((c,k)=>cmtHtml(c,k)).join('');
    return;
  }

  if(t.id==='sendloc'){
    t.textContent='定位中…';
    // 注意：telegram-web-app.js 在普通浏览器里也会造出 tg 和 LocationManager，
    // 但它的回调永远不来。所以必须先确认真的在 Telegram 里，否则直接走浏览器定位。
    const inTG = !!(tg && ((tg.initData && tg.initData.length) ||
                           (tg.platform && tg.platform !== 'unknown')));
    const LM = inTG ? tg.LocationManager : null;
    let done=false;
    const fail=m=>{ if(!done){ done=true; t.textContent=m; } };
    const ok=async (lat,lon)=>{
      if(done) return; done=true;
      const rj = await (await fetch('/api/loc',{method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({lat,lon,auto:false})})).json();
      if(rj && rj.skipped){
        t.textContent='还在刚才那个地方，就不重复记了';
        setTimeout(()=>{ t.textContent='报个平安'; }, 2600);
        return;
      }
      S=await(await fetch('/api/state')).json();
      // 地图重建一次就白屏，所以把活着的地图节点先摘下来，渲染完再塞回去
      const oldBox=document.getElementById('amapbox');
      if(oldBox) oldBox.remove();
      $('pbody').innerHTML=render('loc');
      const slot=document.getElementById('amapbox');
      if(oldBox && slot){
        slot.replaceWith(oldBox);
        const pos=[lon,lat];
        try{
          if(window.__herMk){ window.__herMk.setPosition(pos); }
          else if(window.__AMap){
            window.__herMk=avMarker(window.__AMap,pos,'/av-her.png?v=2',NAMES.her+'在这');
            window.__map.add(window.__herMk);
          }
          window.__her=pos;
          window.__map.setZoomAndCenter(14,pos,false,500);
        }catch(e){}
      } else {
        requestAnimationFrame(()=>setTimeout(initMap,60));
      }
      tg?.HapticFeedback?.impactOccurred?.('light');
    };
    // 20 秒还没结果就别卡着了
    setTimeout(()=>fail('等太久了，没拿到位置。换个办法：直接在 Telegram 里给我发个位置'),30000);
    if(LM){
      try{
        LM.init(()=>{
          try{
            LM.getLocation(loc=>{
              if(loc && loc.latitude) ok(loc.latitude,loc.longitude);
              else fail('Telegram 没给位置，可能是它自己的定位权限没开');
            });
          }catch(e){ fail('Telegram 定位调用失败：'+e.message); }
        });
      }catch(e){ fail('Telegram 定位初始化失败：'+e.message); }
      return;
    }
    if(!window.isSecureContext){
      fail('这个页面不是 https 打开的，浏览器不给定位。请用 https 的地址重新打开，再加到主屏幕');
      return;
    }
    if(!navigator.geolocation){ fail('这台设备不支持定位'); return; }
    navigator.geolocation.getCurrentPosition(
      p => ok(p.coords.latitude, p.coords.longitude),
      err => {
        const why = {1:'定位权限被挡了，去 设置-Safari-位置 里放行',
                     2:'系统定位服务没开，或者拿不到信号',
                     3:'定位超时了，再点一次试试'}[err.code] || ('出错了 '+err.code);
        fail(why);
      },
      {enableHighAccuracy:false, timeout:25000, maximumAge:300000});
    return;
  }
  if(t.dataset.m){
    await fetch('/api/mood',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mood:t.dataset.m})});
    S.moods[S.today]=t.dataset.m;
    [...document.querySelectorAll('[data-m]')].forEach(x=>x.classList.toggle('on',x.dataset.m===t.dataset.m));
    tg?.HapticFeedback?.impactOccurred?.('light');
  }
  if(t.dataset.t){
    await fetch('/api/event',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:t.dataset.t})});
    S.events.unshift({type:t.dataset.t,day:S.today});
    $('log').innerHTML = logHtml();
    tg?.HapticFeedback?.impactOccurred?.('light');
  }
  if(t.id==='undo' && S.events.length){
    await fetch('/api/event/undo',{method:'POST'});
    S.events.shift(); $('log').innerHTML = logHtml();
  }
};

boot();
setInterval(boot, 120000);
setTimeout(autoReport, 2500);
